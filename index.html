<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1e1d1b">
<title>교양 앱</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="icon" type="image/png" href="icons/hub-favicon.png">
<link rel="apple-touch-icon" href="icons/hub-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="교양 앱">
<script>try{if(JSON.parse(localStorage.getItem('culture:theme')||'"dark"')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<style>
/* 세 앱으로 가는 첫 화면: 앱마다 자기 파스텔 색의 카드 한 장. 바탕은 앱과 같이 늘 어둡게(읽기 설정에서 '밝게'를 고르면 밝게) */
:root{--bg:#1e1d1b;--ink:#ebeae6;--ink2:#cfccc5;--mute:#a5a39e;--card-ink:#2a2723;--display:"Hahmlet",-apple-system,"Apple SD Gothic Neo",sans-serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#f1f0ed;--ink:#24231f;--ink2:#44423d;--mute:#67645e;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
main{max-width:620px;margin:0 auto;padding-block:calc(40px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0;font-family:var(--display);font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.045em}
.lead{margin:10px 0 28px;color:var(--ink2);font-size:18px;line-height:1.55}
.apps{display:grid;gap:12px}
.app{display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:190px;padding:22px 22px 20px;border-radius:22px;background:var(--a);color:var(--card-ink);text-decoration:none}
.app:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.app:active{transform:scale(.985)}
.app h2{margin:0;font-family:var(--display);font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.04em}
.app p{margin:8px 0 0;font-size:16px;line-height:1.5;opacity:.8}
.app .row{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700}
.app .row span:last-child{font-size:22px;line-height:1}
.foot{margin:30px 0 0;font-size:15px;line-height:1.65;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.app{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}.app:nth-child(2){animation-delay:70ms}.app:nth-child(3){animation-delay:140ms}@keyframes rise{from{opacity:0;transform:translateY(18px)}}}
</style>
</head>
<body>
<main>
<h1>교양 앱</h1>
<p class="lead">10분이면 한 장, 알고 나면 달리 보이는 이야기들.</p>
<nav class="apps">
<a class="app" href="sangsik.html" style="--a:#efbfa9" data-app="sangsik"><div><h2>10분 상식</h2><p>궁금한 질문 하나, 이야기 한 편</p></div><div class="row"><span class="n">53장</span><span aria-hidden="true">→</span></div></a>
<a class="app" href="japan.html" style="--a:#f0c2c2" data-app="japan"><div><h2>알고 가면 보이는 일본</h2><p>역사와 사건, IP, 요즘 문화, 그리고 그늘까지</p></div><div class="row"><span class="n">53장</span><span aria-hidden="true">→</span></div></a>
<a class="app" href="korea.html" style="--a:#c3d4ec" data-app="korea"><div><h2>알고 보면 새로운 한국</h2><p>한국인도 몰랐던 역사와 사건, K-콘텐츠, 요즘 문화, 그리고 그늘까지</p></div><div class="row"><span class="n">53장</span><span aria-hidden="true">→</span></div></a>
</nav>
<p class="foot">사파리에서 공유 버튼 → '홈 화면에 추가'를 누르면 앱처럼 쓸 수 있고, 한 번 연 뒤에는 인터넷 없이도 열려요. 앱마다 따로 추가해도 돼요. 읽은 기록과 즐겨찾기는 이 기기에만 저장돼요.</p>
</main>
<script>
// 앱마다 읽은 장 수를 보여 준다 (각 앱이 저장한 '<앱>:read'를 읽기만 한다)
document.querySelectorAll('.app').forEach(function (a) {
  try { var n = (JSON.parse(localStorage.getItem(a.dataset.app + ':read') || '[]')).length; if (n) a.querySelector('.n').textContent = n + ' / 53장 읽음'; } catch (e) {}
});
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})</script>
</body>
</html>
